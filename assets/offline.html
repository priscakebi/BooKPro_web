<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - BookPro Pro</title>
    <link rel="stylesheet" href="app.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#16123a;color:#fff;text-align:center;padding:2rem">
    <div>
        <img src="icons/icon-192.png" alt="" width="96" height="96" style="border-radius:22px;margin-bottom:1.5rem">
        <h1 style="font-size:1.6rem">Vous êtes hors ligne</h1>
        <p style="opacity:.75;max-width:340px;margin:0 auto 1.5rem">Les pages déjà consultées restent disponibles. Reconnectez-vous à Internet pour voir les dernières réservations.</p>
        <button onclick="location.reload()" style="background:#5b4ef5;color:#fff;border:0;border-radius:12px;padding:.8rem 1.6rem;font-weight:700">Réessayer</button>
    </div>
</body>
</html>
